<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiments — team key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --g1:#F7F7F7; --g2:#EDEDED; --g3:#D9D9D9; --g4:#A3A3A3; --g5:#6E6E6E; --white:#FFFFFF;
    --sh-md:0 2px 4px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08);
    --ease:cubic-bezier(.32,.72,.24,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--white);color:var(--ink);
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--g3) 1px, transparent 1px);
    background-size:26px 26px;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  .card{
    width:min(400px,92vw);background:var(--white);border:1px solid var(--g2);border-radius:20px;
    padding:40px 36px 34px;box-shadow:var(--sh-md);text-align:center;
    animation:rise .5s var(--ease) backwards;
  }
  .card.no{animation:shake .35s}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
  p{color:var(--g5);font-size:13px;margin:8px 0 22px}
  .row{display:flex;gap:8px}
  input{
    flex:1;min-width:0;padding:11px 16px;border:1px solid var(--g2);border-radius:999px;
    background:var(--g1);font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);
    outline:none;text-align:center;letter-spacing:.06em;
  }
  input:focus{border-color:var(--ink);background:var(--white)}
  button{
    padding:11px 20px;border:none;border-radius:999px;background:var(--ink);color:var(--white);
    font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .err{font-size:12px;font-weight:600;color:var(--ink);margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Experiments</h1>
  <p>This space belongs to a team. Enter the team key once — this browser stays unlocked.</p>
  <div class="row">
    <input type="password" id="key" placeholder="team key" autofocus
           onkeydown="if(event.key==='Enter')go()">
    <button onclick="go()">Enter</button>
  </div>
  <p class="err" id="err"></p>
</div>
<script src="/config.js"></script>
<script type="module">
const SB_CFG = window.SUPABASE_CONFIG || {};
let sb = null;
if(SB_CFG.url && SB_CFG.anonKey){
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sb = createClient(SB_CFG.url, SB_CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  /* already unlocked in this browser? go straight through */
  const { data } = await sb.auth.getSession();
  if(data && data.session) location.href = new URLSearchParams(location.search).get('to') || '/';
}

async function go(){
  const key = document.getElementById('key').value;
  const err = document.getElementById('err');
  if(!key) return;
  try{
    if(!sb) throw new Error('no config');
    /* the "team key" is the shared account's password — knowing it == being in */
    const { error } = await sb.auth.signInWithPassword({ email: SB_CFG.teamEmail, password: key });
    if(error) throw error;
    location.href = new URLSearchParams(location.search).get('to') || '/';
    return;
  }catch(e){
    err.textContent = (e && /invalid|credential/i.test(e.message || ''))
      ? 'Not it — ask a teammate for the key.'
      : 'Could not verify the key — try again.';
  }
  const card = document.getElementById('card');
  card.classList.remove('no'); void card.offsetWidth; card.classList.add('no');
  document.getElementById('key').select();
}
window.go = go;
</script>
</body>
</html>
